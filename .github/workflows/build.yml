name: Montar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Montar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk Transcritor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Transcritor
          path: Transcritor.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Transcritor 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Baixe o **Transcritor.apk** abaixo e toque nele para instalar.
          files: Transcritor.apk
